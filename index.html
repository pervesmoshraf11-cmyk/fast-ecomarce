
<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyShop - Premium Online Shopping</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="logo">My<span>Shop.</span></div>
    <input type="text" id="search" placeholder="Search products...">
    <button id="cartButton">Cart 🛒 <span id="cartCount">0</span></button>
</header>

<section class="hero">
    <div>
        <p class="tagline">WELCOME TO MYSHOP</p>
        <h1>Discover Your<br>Perfect Style.</h1>
        <p>Shop your favorite products at one place.</p>
        <a href="#products" class="shop-btn">Shop Now →</a>
    </div>
    <img src="https://images.unsplash.com/photo-1441986300917-64674bd600d8?w=800" alt="Shopping">
</section>

<section id="products">
    <h2>Our Products</h2>
    <p class="subtitle">Explore our popular collection</p>
    <div class="product-grid" id="productGrid"></div>
</section>

<section class="features">
    <div>🚚 <b>Easy Ordering</b></div>
    <div>💚 <b>Quality Products</b></div>
    <div>🔒 <b>Simple Shopping</b></div>
</section>

<footer>
    <h2>MyShop.</h2>
    <p>© 2026 MyShop. All Rights Reserved.</p>
</footer>

<div id="cartPanel" class="cart-panel">
    <button id="closeCart" class="close">✕</button>
    <h2>Your Shopping Cart</h2>
    <div id="cartItems"></div>
    <h3 id="total">Total: ৳0</h3>
    <button id="orderButton">Place Order</button>
</div>

<script src="script.js"></script>
</body>
</html>
